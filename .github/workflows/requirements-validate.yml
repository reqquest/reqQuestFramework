name: requirements

# The toolkit update/drift check does NOT run here — it lives in its own workflow
# (requirements-toolkit-check.yml), triggered only by `schedule` and `workflow_dispatch`.
# Publishing a toolkit release must never turn an adopter's unrelated push/PR red
# (reqquest/reqQuestFramework#4).
on:
  # `push` is scoped to the long-lived branches on purpose: a branch with an open PR would
  # otherwise run this twice per commit, once for the push and once for the synchronize.
  push:
    branches: [main, develop]
  pull_request:

# Superseded commits do not need their own run.
concurrency:
  group: requirements-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate requirements
        run: python3 .reqq/validator/reqq_validate_stdlib.py --all
