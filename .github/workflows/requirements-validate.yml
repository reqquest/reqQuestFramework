name: requirements

# The toolkit update/drift check does NOT run here — it lives in its own workflow
# (requirements-toolkit-check.yml), triggered only by `schedule` and `workflow_dispatch`.
# Publishing a toolkit release must never turn an adopter's unrelated push/PR red
# (reqquest/reqQuestFramework#4).
on:
  # `push` is scoped to the long-lived branches on purpose: a branch with an open PR would
  # otherwise run this twice per commit, once for the push and once for the synchronize.
  push:
    branches: [main, develop]
  pull_request:

# Superseded commits do not need their own run.
concurrency:
  group: requirements-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install validator dependencies
        run: python -m pip install -r .reqq/validator/requirements.txt

      - name: Validate requirements
        run: python3 .reqq/validator/reqq_validate.py --all

      - name: Verify code owners on the host
        # Rule V6 at ownership.mode enforce: the branch requires review from code owners and
        # every handle can approve. Below enforce no request is made and no token is needed.
        # OWNERS_VERIFY_TOKEN (Administration: read, Contents: read) is needed only for classic branch protection.
        run: python3 .reqq/validator/reqq_validate.py --check owners-host
        env:
          GITHUB_TOKEN: ${{ secrets.OWNERS_VERIFY_TOKEN || secrets.GITHUB_TOKEN }}
