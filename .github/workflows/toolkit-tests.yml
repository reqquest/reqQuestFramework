name: toolkit tests

# The framework's own test suite. Deliberately NOT named `requirements-*.yml`: the
# boundary in toolkit-manifest.json ships `.github/workflows/requirements-*.yml` to
# adopters, and `tests/` is not part of that boundary — a test step inside the shipped
# template would fail on the adopter's very first CI run.

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: toolkit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          status=0
          for t in tests/test_*.py; do
            echo "--- $t"
            python3 "$t" || status=1
          done
          exit $status

      - name: Packer resolves the manifest boundary
        run: python3 scripts/pack-toolkit.py --list
