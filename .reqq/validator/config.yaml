# Validator configuration of this repository, the first adopter of the toolkit.
# It is the template config.example.yaml with the keys below; the examples in requirements/
# carry the prefix REQQF and a short title in the file name.

language: en
id_prefix: REQQF
short_title: true
enforce_layout: true
require_full_traceability: true
exclude_globs: []

# Markdown link check: requirements/ and the methodology in docs/.
link_check_paths:
  - requirements
  - docs

# Toolkit versioning: the check of the local files against .reqq/toolkit.lock.
toolkit:
  update_channel: stable
  update_check: notify
  host: github
